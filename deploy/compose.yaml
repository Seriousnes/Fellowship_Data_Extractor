services:
  codex:
    image: ghcr.io/seriousnes/fellowship-codex:${CODEX_TAG}
    container_name: fellowship-codex
    ports:
      - "127.0.0.1:5280:8080"
    env_file:
      - codex.env
    environment:
      DOTNET_gcServer: "0"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ASPNETCORE_URLS: "http://+:8080"
      Usage__Database: /data/usage.db
      Codex__Image: ${CODEX_TAG}
    volumes:
      - codex-data:/data
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  codex-data:
