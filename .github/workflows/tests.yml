name: Tests

on:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Name the newest export
        id: export
        run: |
          folder=$(for d in output/export-*/; do
            if [ -f "${d}entities.jsonl" ] && [ -f "${d}settings.json" ]; then printf '%s\n' "${d%/}"; fi
          done | sort -t- -k2 -n | tail -1)
          if [ -z "$folder" ]; then
            echo "No output/export-* folder carries both entities.jsonl and settings.json." >&2
            exit 1
          fi
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          echo "build=${folder#output/export-}" >> "$GITHUB_OUTPUT"
          echo "The checkout carries $(find output/ui -type f | wc -l) texture files beside $folder."

      - name: Run the codex tests
        run: dotnet test src/Fellowship.Codex.Tests
