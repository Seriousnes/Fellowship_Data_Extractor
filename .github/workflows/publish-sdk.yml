name: Publish the SDK

on:
  push:
    branches:
      - master
    paths:
      - src/Fellowship.SDK/**
      - src/Fellowship.SDK.Generators/**
      - .github/workflows/publish-sdk.yml
  workflow_dispatch:

concurrency:
  group: publish-sdk

env:
  FEED: https://nuget.pkg.github.com/Seriousnes/index.json

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack the SDK
        run: dotnet pack src/Fellowship.SDK -c Release -p:BuildNumber=${{ github.run_number }} -o package

      - name: Push the package to the feed
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push 'package/*.nupkg' --source "$FEED" --api-key "$TOKEN"
